name: poke-app (Windows)

# The Pokemon-styled FireRed/LeafGreen edition of the desktop app, built for Windows from the poke-app
# branch. It runs by hand (Actions, poke-app (Windows), Run workflow) and on pushes to poke-app that touch
# the app. The radio firmware is unchanged from upstream, so the images come from Decryptu/pokeldn's
# release (radio and controller images) instead of six ESP-IDF builds, and so does the Flet client (see its
# step). The zip is a workflow artifact; nothing is published.
on:
  workflow_dispatch:
  push:
    branches: [poke-app]
    paths:
      - "gui/**"
      - "pokeldn/**"
      - "bin/**"
      - "services/pkhex/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/poke-app.yml"

permissions:
  contents: read

env:
  UPSTREAM_RELEASE: v0.22.2   # the upstream release merged in: its firmware images and its Flet client

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            gui/requirements.txt
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Radio firmware from the upstream release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p gui/firmware
          gh release download "$UPSTREAM_RELEASE" -R Decryptu/pokeldn -p "pokeldn-*.bin" -D gui/firmware
          ls -la gui/firmware
      - name: Install
        run: python -m pip install -r gui/requirements.txt
      - name: Flet client from the upstream release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The client is upstream's source (gui/flet_drop, scripts/build_client.py), so the release's build is
          # taken as it is. Smart App Control trusts the files of that widely downloaded build, and blocked
          # the unsigned plugin DLLs a fresh build makes (pasteboard_plugin.dll, error 0xc0e90002).
          gh release download "$UPSTREAM_RELEASE" -R Decryptu/pokeldn -p "pokeldn-windows-x64.zip" -D upstream
          python -m zipfile -e upstream/pokeldn-windows-x64.zip upstream/app
          mkdir -p gui/client/windows
          python -m zipfile -e upstream/app/pokeldn/_internal/flet_desktop/app/flet-windows.zip gui/client/windows
          echo "flet $(python -c "from importlib.metadata import version; print(version('flet'))")" \
            > gui/client/windows/pokeldn-drop
          ls -la gui/client/windows/flet
      - name: Restore the ARM-only Unicorn
        id: unicorn
        uses: actions/cache@v4
        with:
          path: |
            gui/unicorn/lib
            gui/unicorn/pokeldn-unicorn
          key: unicorn-${{ runner.os }}-${{ hashFiles('requirements.txt', 'scripts/build_unicorn.py') }}
      - name: Build the ARM-only Unicorn
        if: steps.unicorn.outputs.cache-hit != 'true'
        run: python scripts/build_unicorn.py
      - name: Pack
        run: python scripts/pack_app.py
      - name: Verify the frozen app
        run: python scripts/check_app.py dist/pokeldn/pokeldn.exe
      - name: Archive
        run: Compress-Archive -Path dist/pokeldn -DestinationPath pokeldn-pokemon-windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: pokeldn-pokemon-windows-x64
          path: pokeldn-pokemon-windows-x64.zip
          retention-days: 30
